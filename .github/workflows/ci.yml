name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on a PR (repeated pushes), but never on main — every
# commit that lands on main gets its own complete run, not one cancelled by the
# next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A throwaway Postgres so the Supabase adapter's integration + RLS-deny suite
    # actually runs here — it self-skips without DATABASE_URL. No secrets needed;
    # the test stands up its own roles, grants, and schema against an empty database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format (Biome)
        run: bunx biome ci .

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Build
        run: bun run build
